services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - redis_network

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      - redis
    env_file:
      - .env
    networks:
      - redis_network

  celery:
    build: .
    command: celery -A library_api worker -l info
    depends_on:
      - redis
    env_file:
      - .env
    networks:
      - redis_network
  
  celery-beat:
    build: .
    command: celery -A library_api beat -l info
    depends_on:
      - redis
    env_file:
      - .env
    networks:
      - redis_network
  
networks:
  redis_network:
    driver: bridge
