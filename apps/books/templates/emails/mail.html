<!DOCTYPE html>
<html>
<body>
    <h2>{{ title }}</h2>
    <p>{{ subtitle }}</p>
    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Title</th>
                <th>Published</th>
            </tr>
        </thead>
        <tbody>
            {% for title, year in books %}
            <tr>
                <td>{{ title }}</td>
                <td>{{ year }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <p>Enjoy reading!</p>
</body>
</html>
